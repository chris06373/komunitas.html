<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b45309" />
  <title>Labirin Komunitas</title>
  <style>
    :root {
      --bg-warm: #faf5eb;
      --surface: #fffdf9;
      --surface-alt: #f3ead8;
      --ink: #292524;
      --muted: #78716c;
      --accent: #b45309;
      --accent-hover: #92400e;
      --sage: #15803d;
      --line: #e7dec8;
      --shadow: 0 18px 40px rgba(68, 51, 28, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #fef3c7 0%, transparent 45%),
        radial-gradient(circle at bottom right, #dcfce7 0%, transparent 40%),
        var(--bg-warm);
      color: var(--ink);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .studio-shell {
      width: 100%;
      max-width: 1040px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      background: var(--surface-alt);
      border-bottom: 1px solid var(--line);
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: 0.16s ease;
    }

    .pill-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 28px;
      padding: 28px;
    }

    @media (max-width: 840px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .profile-card {
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--line);
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      animation: gentleBob 2.8s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .profile-name {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .profile-sub {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .records-panel {
      margin-top: 18px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
    }

    .records-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .records-header h2 {
      font-size: 0.88rem;
      color: var(--accent);
    }

    .reset-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .records-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.8rem;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 2px;
      border-bottom: 1px dashed var(--line);
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .step-block {
      margin-bottom: 18px;
    }

    .step-title {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      display: inline-grid;
      place-items: center;
    }

    .text-field {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
    }

    .text-field:focus {
      border-color: var(--accent);
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .choice-chip:hover {
      border-color: var(--accent);
    }

    .choice-chip.active {
      background: #fef3c7;
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .swatch.active {
      border-color: var(--ink);
      transform: scale(1.14);
    }

    .diff-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .diff-columns {
        grid-template-columns: 1fr;
      }
    }

    .diff-option {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s ease;
    }

    .diff-option:hover {
      border-color: var(--accent);
    }

    .diff-option.active {
      background: #fef3c7;
      border-color: var(--accent);
    }

    .diff-option strong {
      display: block;
      font-size: 0.9rem;
    }

    .diff-option span {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .level-strip {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
    }

    @media (max-width: 560px) {
      .level-strip {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .lvl-pick {
      padding: 9px 4px;
      border-radius: 11px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .lvl-pick.active {
      background: var(--sage);
      border-color: var(--sage);
      color: #fff;
    }

    .fog-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-alt);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .launch-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .launch-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🧭</div>
        <div>
          <h1>Studio Pemimpin Komunitas</h1>
          <p>Halaman 1 dari 2 • Atur karakter, pilih level 1–10, lalu masuk arena</p>
        </div>
      </div>
      <div class="topbar-controls">
        <button class="pill-btn" id="soundBtn" type="button">🔊 Suara: ON</button>
        <a class="pill-btn" href="game.html?diff=easy&level=1">Langsung ke Arena →</a>
      </div>
    </header>

    <div class="main-grid">
      <aside class="profile-card">
        <div class="avatar-ring" id="avatarBox"></div>
        <div class="profile-name" id="nameReadout">Nara</div>
        <div class="profile-sub" id="roleReadout"></div>

        <div class="records-panel">
          <div class="records-header">
            <h2>🏅 Papan Rekor</h2>
            <button class="reset-link" id="clearRecordsBtn" type="button">Hapus</button>
          </div>
          <div class="records-list" id="recordsList"></div>
        </div>
      </aside>

      <section>
        <div class="step-block">
          <div class="step-title"><span class="step-num">1</span> Nama Pemimpin</div>
          <input class="text-field" type="text" id="leaderName" maxlength="14" value="Nara" />
        </div>

        <div class="step-block">
          <div class="step-title"><span class="step-num">2</span> Warna Seragam</div>
          <div class="flex-row" id="swatchGroup"></div>
        </div>

        <div class="step-block">
          <div class="step-title"><span class="step-num">3</span> Gaya Rambut & Aksesori</div>
          <div class="flex-row" id="hairGroup"></div>
        </div>

        <div class="step-block">
          <div class="step-title"><span class="step-num">4</span> Peran Utama</div>
          <div class="flex-row" id="roleGroup"></div>
        </div>

        <div class="step-block">
          <div class="step-title"><span class="step-num">5</span> Tingkat Tantangan</div>
          <div class="diff-columns" id="diffGroup"></div>
        </div>

        <div class="step-block">
          <div class="step-title"><span class="step-num">6</span> Pilih Level (1 – 10)</div>
          <div class="level-strip" id="levelGroup"></div>
        </div>

        <label class="fog-box" for="fogCheck">
          <div>
            <strong>🌫️ Kabut Misteri</strong>
            <div style="font-size: 0.78rem; color: var(--muted);">Area yang belum terjamah disamarkan</div>
          </div>
          <input type="checkbox" id="fogCheck" style="width: 18px; height: 18px; accent-color: var(--accent);" />
        </label>

        <button class="launch-btn" id="goGameBtn" type="button">
          Mulai Ekspedisi di Level 1 🚀
        </button>
      </section>
    </div>
  </div>

  <script>
    const STORE_KEY = 'komunitas_hub_state_v1';

    const SHIRT_COLORS = ['#15803d', '#0369a1', '#b45309', '#be185d', '#6d28d9', '#b91c1c'];
    const HAIR_STYLES = [
      { id: 'short', label: 'Pendek Rapi' },
      { id: 'curly', label: 'Keriting' },
      { id: 'cap', label: 'Topi' },
      { id: 'glasses', label: 'Kacamata' }
    ];
    const LEADER_ROLES = [
      { id: 'scout', label: '🧭 Penjelajah', perk: '+8 langkah awal' },
      { id: 'shield', label: '🛡️ Pendamai', perk: 'efek jebakan -50%' },
      { id: 'cheer', label: '✨ Penyemangat', perk: 'hadiah 2x lipat' }
    ];
    const DIFF_LEVELS = [
      { id: 'easy', name: '🌱 Mudah', note: 'Jalur lebih terbuka' },
      { id: 'medium', name: '🔥 Agak Sulit', note: 'Tantangan seimbang' },
      { id: 'hard', name: '⚡ Sulit', note: 'Labirin padat & ketat' }
    ];

    function readHubState() {
      const fallback = {
        profile: { name: 'Nara', color: SHIRT_COLORS[0], hair: 'short', role: 'scout' },
        diff: 'easy',
        level: 1,
        fog: false,
        sound: true,
        records: {}
      };
      try {
        const raw = JSON.parse(localStorage.getItem(STORE_KEY));
        return {
          ...fallback,
          ...(raw || {}),
          profile: { ...fallback.profile, ...((raw && raw.profile) || {}) },
          records: (raw && raw.records) || {}
        };
      } catch {
        return fallback;
      }
    }

    function writeHubState() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(hubState));
      } catch {}
    }

    const hubState = readHubState();

    function drawPortrait(color, hair, crowned = false) {
      let headgear = `<path d="M31 28 Q50 12 69 28 Z" fill="#1c1917"/>`;
      if (hair === 'curly') {
        headgear = `<circle cx="32" cy="24" r="9" fill="#1c1917"/><circle cx="50" cy="20" r="10" fill="#1c1917"/><circle cx="68" cy="24" r="9" fill="#1c1917"/>`;
      } else if (hair === 'cap') {
        headgear = `<path d="M30 28 Q50 10 70 28 Z" fill="#d97706"/><rect x="48" y="24" width="28" height="5" rx="2.5" fill="#92400e"/>`;
      } else if (hair === 'glasses') {
        headgear = `<path d="M32 26 Q50 14 68 26 Z" fill="#1c1917"/><circle cx="42" cy="38" r="6" fill="none" stroke="#1c1917" stroke-width="2.5"/><circle cx="58" cy="38" r="6" fill="none" stroke="#1c1917" stroke-width="2.5"/><line x1="48" y1="38" x2="52" y2="38" stroke="#1c1917" stroke-width="2.5"/>`;
      }
      const badge = crowned ? `<polygon points="42,12 46,5 50,11 54,5 58,12" fill="#f59e0b"/>` : '';
      return `
        <svg viewBox="0 0 100 110" width="96" height="106">
          <path d="M26 95 C26 68, 74 68, 74 95 Z" fill="${color}" />
          <circle cx="50" cy="38" r="19" fill="#fde68a" />
          <circle cx="43" cy="38" r="2.3" fill="#1c1917" />
          <circle cx="57" cy="38" r="2.3" fill="#1c1917" />
          <path d="M44 45 Q50 51 56 45" fill="none" stroke="#1c1917" stroke-width="2.3" stroke-linecap="round"/>
          ${headgear}${badge}
        </svg>
      `;
    }

    function syncPortrait() {
      document.getElementById('avatarBox').innerHTML = drawPortrait(
        hubState.profile.color,
        hubState.profile.hair,
        true
      );
      document.getElementById('nameReadout').textContent = hubState.profile.name;
      const rObj = LEADER_ROLES.find(r => r.id === hubState.profile.role) || LEADER_ROLES[0];
      document.getElementById('roleReadout').textContent = `${rObj.label} • ${rObj.perk}`;
      document.getElementById('goGameBtn').textContent = `Mulai Ekspedisi di Level ${hubState.level} 🚀`;
    }

    function syncRecords() {
      const box = document.getElementById('recordsList');
      const list = Object.entries(hubState.records);
      if (!list.length) {
        box.innerHTML = `<div style="color:var(--muted)">Belum ada rekor tersimpan.</div>`;
        return;
      }
      box.innerHTML = list
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([label, pts]) => `<div class="record-item"><span>${label}</span><strong>${pts} pts</strong></div>`)
        .join('');
    }

    function buildSetupPage() {
      const nameInput = document.getElementById('leaderName');
      nameInput.value = hubState.profile.name;
      nameInput.addEventListener('input', (e) => {
        hubState.profile.name = e.target.value.trim() || 'Nara';
        syncPortrait();
        writeHubState();
      });

      const swatchGroup = document.getElementById('swatchGroup');
      SHIRT_COLORS.forEach(hex => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'swatch' + (hex === hubState.profile.color ? ' active' : '');
        dot.style.background = hex;
        dot.onclick = () => {
          hubState.profile.color = hex;
          swatchGroup.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
          dot.classList.add('active');
          syncPortrait();
          writeHubState();
        };
        swatchGroup.appendChild(dot);
      });

      const hairGroup = document.getElementById('hairGroup');
      HAIR_STYLES.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-chip' + (item.id === hubState.profile.hair ? ' active' : '');
        btn.textContent = item.label;
        btn.onclick = () => {
          hubState.profile.hair = item.id;
          hairGroup.querySelectorAll('.choice-chip').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          syncPortrait();
          writeHubState();
        };
        hairGroup.appendChild(btn);
      });

      const roleGroup = document.getElementById('roleGroup');
      LEADER_ROLES.forEach(role => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice-chip' + (role.id === hubState.profile.role ? ' active' : '');
        btn.textContent = `${role.label} (${role.perk})`;
        btn.onclick = () => {
          hubState.profile.role = role.id;
          roleGroup.querySelectorAll('.choice-chip').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          syncPortrait();
          writeHubState();
        };
        roleGroup.appendChild(btn);
      });

      const diffGroup = document.getElementById('diffGroup');
      DIFF_LEVELS.forEach(d => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'diff-option' + (d.id === hubState.diff ? ' active' : '');
        card.innerHTML = `<strong>${d.name}</strong><span>${d.note}</span>`;
        card.onclick = () => {
          hubState.diff = d.id;
          diffGroup.querySelectorAll('.diff-option').forEach(el => el.classList.remove('active'));
          card.classList.add('active');
          writeHubState();
        };
        diffGroup.appendChild(card);
      });

      const levelGroup = document.getElementById('levelGroup');
      for (let lvl = 1; lvl <= 10; lvl++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lvl-pick' + (lvl === hubState.level ? ' active' : '');
        btn.textContent = lvl;
        btn.onclick = () => {
          hubState.level = lvl;
          levelGroup.querySelectorAll('.lvl-pick').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          syncPortrait();
          writeHubState();
        };
        levelGroup.appendChild(btn);
      }

      const fogCheck = document.getElementById('fogCheck');
      fogCheck.checked = Boolean(hubState.fog);
      fogCheck.addEventListener('change', () => {
        hubState.fog = fogCheck.checked;
        writeHubState();
      });

      const soundBtn = document.getElementById('soundBtn');
      const refreshSoundBtn = () => {
        soundBtn.textContent = hubState.sound ? '🔊 Suara: ON' : '🔇 Suara: OFF';
      };
      refreshSoundBtn();
      soundBtn.addEventListener('click', () => {
        hubState.sound = !hubState.sound;
        refreshSoundBtn();
        writeHubState();
      });

      document.getElementById('clearRecordsBtn').addEventListener('click', () => {
        hubState.records = {};
        writeHubState();
        syncRecords();
      });

      document.getElementById('goGameBtn').addEventListener('click', () => {
        writeHubState();
        const url = `game.html?diff=${encodeURIComponent(hubState.diff)}&level=${encodeURIComponent(hubState.level)}`;
        window.location.href = url;
      });

      syncPortrait();
      syncRecords();
    }

    buildSetupPage();
  </script>
</body>
</html>
